[package]
name = "app-server"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
app-store = { path = "../app-store" }
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"
regex = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }

tempfile = "3"

sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }

[[bin]]
name = "vision-server"
path = "src/main.rs"

[[bin]]
name = "catalog-package"
path = "src/bin/catalog-package.rs"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
