[package]
name = "vision-launcher"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "VisionOverlay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
