name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VISION_BUILD_COMMIT: ${{ github.sha }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Publication and version checks
        shell: pwsh
        run: |
          python scripts/audit_publication.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { python scripts/check_release.py $env:GITHUB_REF_NAME; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Prepare pinned catalog and web assets
        run: powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File scripts/Build-Web.ps1
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p auto-artifactarium --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python tests and contracts
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_contract_examples.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend tests
        run: npm --prefix web test
      - name: Watcher policy tests
        run: powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File scripts/Test-AutoCapturePolicy.ps1
      - name: Build portable
        run: powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File scripts/Build-Portable.ps1 -SkipWebBuild
      - name: Verify portable without a desktop or game
        shell: pwsh
        run: |
          $archive=Get-ChildItem -LiteralPath dist -Filter '*.zip' | Select-Object -First 1
          python scripts/verify_portable.py $archive.FullName --output local-data/ci-portable-check --headless
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath local-data/ci-portable-check/verification.json -Destination dist/portable-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-portable
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/portable-verification.json

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-portable
          path: release-assets
      - name: Validate tag and artifact commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_release.py "$RELEASE_TAG"
          # For annotated tags GITHUB_SHA is the tag-object hash, not the
          # commit.  Resolve to the actual commit so the comparison matches
          # what Build-Portable.ps1 wrote via `git rev-parse HEAD`.
          EXPECTED_COMMIT="$(git rev-parse HEAD)"
          export EXPECTED_COMMIT
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path('release-assets')
          archive=next(root.glob('*.zip'))
          expected=pathlib.Path(str(archive)+'.sha256').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected
          with zipfile.ZipFile(archive) as z:
              name=next(n for n in z.namelist() if n.endswith('/package-manifest.json'))
              manifest=json.loads(z.read(name))
              assert manifest['build_commit']==os.environ['EXPECTED_COMMIT'],f"build_commit {manifest['build_commit']} != expected {os.environ['EXPECTED_COMMIT']}"
              assert 'v'+manifest['version']==os.environ['RELEASE_TAG']
          PY
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease --title "Vision Overlay $RELEASE_TAG" --notes-file packaging/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
